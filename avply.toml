# vim: set ft=toml fenc=utf-8 ff=unix sw=4 ts=4 et :
##################################################
# avply 設定ファイル
##################################################
# ローカル PC 固有のパスは avply.local.toml に記載すると、
# このファイルの値を後勝ちで上書きできる（VCS 管理外）。

# ffmpeg 設定
[ffmpeg]
# ffmpeg.exe のフルパス
# 動画変換に使用する ffmpeg.exe を指定する。
path = ""

# シーク設定
[seek]
# 左カーソルキーで巻き戻すミリ秒数
# 動画の再生位置をこの値だけ前に戻す。0 以下にするとシーク無効。デフォルトは 5000。
left_ms = 5000
# 右カーソルキーで早送るミリ秒数
# 動画の再生位置をこの値だけ後ろに進める。0 以下にするとシーク無効。デフォルトは 5000。
right_ms = 5000
# Shift+左カーソルキーで巻き戻すミリ秒数
# 通常の左カーソルキーより大きく戻すための値。0 以下にするとシーク無効。デフォルトは 20000。
shift_left_ms = 20000
# Shift+右カーソルキーで早送るミリ秒数
# 通常の右カーソルキーより大きく進めるための値。0 以下にするとシーク無効。デフォルトは 20000。
shift_right_ms = 20000
# マウスホイール前転（上スクロール）で早送るミリ秒数
# シークバーおよびプレビュー領域のホイールに適用する。0 以下にするとシーク無効。デフォルトは 5000。
wheel_forward_ms = 5000
# マウスホイール後転（下スクロール）で巻き戻すミリ秒数
# シークバーおよびプレビュー領域のホイールに適用する。0 以下にするとシーク無効。デフォルトは 5000。
wheel_back_ms = 5000

# 再生設定
[playback]
# 動画読込時の初期再生速度
# 1.00 で等速、0.05 単位で . / , キーまたは Ctrl+ホイールから調整可能。デフォルトは 1.00。
speed = 1.00
# QMediaPlayer の FFmpeg バックエンドに渡す HW デコーダ優先順位
# カンマ区切りで複数指定可能。空文字にすると Qt 自動選択になる。
# GPU 非搭載環境やドライバ非対応の場合、Qt/ffmpeg が自動的に CPU デコードへフォールバックするため未調整でも動作する。
# デフォルトは "d3d11va,cuda"（Windows 共通の Direct3D 11 VA を最優先）。
hw_decoder_priority = "d3d11va,cuda"
# シークバーホバー時のサムネイル抽出に用いる ffmpeg -hwaccel の値
# "auto" / "d3d11va" / "cuda" 等を指定する。"none" または空文字で -hwaccel 指定をスキップする。
# デフォルトは "auto"。
thumbnail_hwaccel = "auto"

# ウィンドウ設定
[window]
# 動画読込時の初期ウィンドウサイズ上限のモニタ比率
# モニタ作業領域（タスクバー除外）に対するウィンドウ幅・高さの上限比率を指定する。
# 例：0.7 ならモニタの 70% を上限としてアスペクト比維持で縮める。デフォルトは 0.7。
# 0.1〜1.0 にクランプされる（範囲外は近い境界値に丸める）。
initial_screen_ratio = 0.7

# 音声設定
[audio]
# 再生音量
# 1.00 で 100%、0.50 で 50%。再生中は上下キーまたは Shift+ホイールで 0.05 単位で調整できる。
# 0.00〜1.00 にクランプされる（範囲外は近い境界値に丸める）。デフォルトは 1.00。
volume = 1.00
# サイレンストーン有効/無効
# Bluetooth ヘッドセットのアイドル復帰時プチノイズ抑制のための常時不可聴トーン出力。
# スピーカー環境や有線 DAC 環境では false にして OS への常時音声出力を停止できる。デフォルトは true。
silence_tone_enabled = true
# サイレンストーンの周波数（Hz）
# 20〜20000 にクランプされる。1kHz は BT コーデックの確実なパスバンド内でコーデックをアクティブ状態に保つ。
# デフォルトは 1000.0。
silence_tone_freq_hz = 1000.0
# サイレンストーンの振幅
# 1.0 = 16bit フルスケール。設定ミスによる過大音量を防ぐため上限は 0.01 にクランプされる。
# 0.0001 ≒ -80dBFS で人耳には不可聴。デフォルトは 0.0001。
silence_tone_amp = 0.0001

# 字幕設定
[subtitle]
# ggml モデルファイル（.bin）の名前またはフルパス
# 再生中の字幕生成（S キー）に使う音声認識モデルを指定する。
# 名前だけを書くと model_url と連結した URL から自動ダウンロードし、
# avply.exe と同じフォルダの model/ へ置く（初回の S キー押下時に確認を出す）。
# フルパスを書いた場合はその実体を使い、自動ダウンロードはしない。
# model/ に他のモデルがあっても、ここで指定した 1 つだけを使う。
# 空のときと未設定時はデフォルトの ggml-large-v3-turbo-q5_0.bin（約 574MB）を使う。
# 主な候補：
#   ggml-large-v3-turbo-q5_0.bin  約 574MB  量子化版。品質はほぼ同等で軽い（デフォルト）
#   ggml-large-v3-turbo.bin       約 1.6GB  非量子化版
#   ggml-medium.bin               約 1.5GB  GPU なしで品質を優先するとき
#   ggml-small.bin                約 490MB  GPU なしで速さを優先するとき
# whisper.cpp が対応しない新形式のモデルを使うには avply の更新が必要になる。
model = ""
# モデルのダウンロード元 URL（末尾のスラッシュを含む）
# model に書いたファイル名をこの URL の後ろへ連結して取得する。
# 空のときと未設定時はデフォルトの Hugging Face の whisper.cpp 公式リポジトリを使う。
model_url = ""
# 認識言語（whisper に渡す言語コード）
# 英語の動画なら "en" にする。空のときと未設定時はデフォルトの "ja"（日本語）を使う。
language = "ja"
# 認識に与える事前文脈（固有名詞や専門用語の聞き取り精度を上げる）
# ここへ書いた語に認識が寄る。単語を並べるより、自然な 1 文へ混ぜた方が効きやすい。
# 強制ではないため、書いた語が必ず出る保証はない。ここへ書いた文体や句読点の打ち方に認識が寄ることもある。
# 長さの上限は 224 トークンで、超えた分は whisper 側が捨てる。改行は書けない（1 行に収める）。
# 記載例：
#   prompt = "ホゲ管理システム、フガ端末、ピヨ通知の打ち合わせです。"
# 空のときと未設定時は何も渡さない（デフォルト）。
# この値を変えると字幕のキャッシュを引き直すため、同じ動画でも認識をやり直す。
prompt = ""
# 字幕の文字色
# "#RRGGBB" 形式で指定する。空のときと解釈できない値のときはデフォルトの "#FFFFFF"（白）を使う。
text_color = "#FFFFFF"
# 字幕の背景色
# "#RRGGBB" 形式で指定する。空のときと解釈できない値のときはデフォルトの "#000000"（黒）を使う。
background_color = "#000000"
# 字幕の背景の不透明度
# 0.0 で透明、1.0 で背景を塗りつぶす。白地の多い映像で字幕が読みにくいときは値を上げる。
# 0.0〜1.0 にクランプされる（範囲外は近い境界値に丸める）。デフォルトは 0.80。
background_opacity = 0.80
