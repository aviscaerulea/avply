# vim: set ft=yaml fenc=utf-8 ff=unix sw=2 ts=2 et :
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Extract version
        id: version
        shell: bash
        run: echo "version=${GITHUB_EVENT_RELEASE_TAG_NAME#v}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtmultimedia'
          cache: true

      # ggml の Vulkan バックエンドは SDK 同梱の glslc でシェーダをコンパイルする
      # LunarG の Windows インストーラは Qt Installer Framework 形式のため、書庫として展開しても
      # Include/ と Lib/ が現れない。サイレントインストールで正規の配置にする
      # （humbletim/install-vulkan-sdk@v1.2 は 7z 展開方式で、この形式に対応できず configure が失敗した）
      # 導入先を指定しない既定の配置は C:\VulkanSDK\<version> だ。llama.cpp の CI が同じ手順を使う
      # 配置を明示検証するのは、SDK が欠けたまま CPU 版の配布物を作る事故を防ぐためだ
      # SDK はキャッシュしない。リリースは低頻度で、253MB のダウンロードを毎回払っても割に合う
      - name: Install Vulkan SDK
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ver = '1.4.313.0'
          $root = "C:\VulkanSDK\$ver"
          $exe = "$env:RUNNER_TEMP\vulkansdk-installer.exe"
          # 進捗表示のレンダリングは 253MB の取得を大きく遅らせるため止める
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -OutFile $exe `
            -Uri "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe"
          & $exe --accept-licenses --default-answer --confirm-command install
          foreach ($p in @("$root\Include\vulkan\vulkan.h", "$root\Lib\vulkan-1.lib", "$root\Bin\glslc.exe")) {
              if (-not (Test-Path $p)) {
                  Write-Error "Vulkan SDK の配置が想定と異なる：$p が無い"
                  exit 1
              }
          }
          "VULKAN_SDK=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$root\Bin"        | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B out `
            -G "Visual Studio 18 2026" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DAVPLY_WHISPER_VULKAN=ON `
            -DAVPLY_VERSION="${{ steps.version.outputs.version }}"

      - name: Build
        shell: pwsh
        run: cmake --build out --config Release

      - name: Verify DLL deployment
        shell: pwsh
        run: |
          $required = @(
              'Qt6Core.dll', 'Qt6Gui.dll', 'Qt6Widgets.dll', 'Qt6Multimedia.dll', 'Qt6Quick.dll', 'Qt6Qml.dll',
              'whisper.dll', 'ggml.dll', 'ggml-base.dll', 'ggml-cpu.dll', 'ggml-vulkan.dll'
          )
          foreach ($dll in $required) {
              if (-not (Test-Path "out\Release\$dll")) {
                  Write-Error "required DLL was not deployed: $dll"
                  exit 1
              }
          }

      - name: Copy assets
        shell: pwsh
        run: |
          Copy-Item avply.toml out\Release\avply.toml
          Copy-Item avply.toml out\Release\avply.toml.example
          New-Item -Path out\Release\avply.local.toml -ItemType File
          # 字幕モデルの置き場。Scoop が persist で版をまたいで保持できるよう空で同梱する
          New-Item -Path out\Release\model -ItemType Directory

      # Compress-Archive は空ディレクトリを格納しない場合があるため、空の model/ も確実に入る ZipFile を使う
      - name: Create zip
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path out\Release).Path,
            (Join-Path (Resolve-Path out).Path "avply-${{ steps.version.outputs.version }}-x64.zip"))

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release upload "$TAG" \
            "out/avply-${VERSION}-x64.zip" \
            --clobber
